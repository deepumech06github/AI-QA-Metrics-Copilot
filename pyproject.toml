[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-qa-metrics-copilot"
version = "1.0.0"
description = "A context-aware quality engineering metrics dashboard and insight assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AI-QA-Metrics-Copilot contributors" }]
dependencies = ["streamlit>=1.40,<2.0", "pandas>=2.2,<4.0"]

[project.optional-dependencies]
llm = ["openai>=1.54,<3.0"]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

